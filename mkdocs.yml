site_name: Saeed Taghavi
site_url: https://saeedtaghavi.github.io/
site_author: Saeed Taghavi
site_description: >-
  Computational neuroscience and infrastructure engineering. Spiking networks,
  phase oscillators, machine learning and the systems that run them.

repo_url: https://github.com/SaeedTaghavi
repo_name: SaeedTaghavi
edit_uri: ""

theme:
  name: material
  custom_dir: overrides
  language: en
  font:
    text: Schibsted Grotesk
    code: IBM Plex Mono
  icon:
    logo: st/mark
    repo: fontawesome/brands/github
  favicon: assets/images/favicon.svg
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Research: research.md
  - Publications: publications.md
  - Software: software.md
  - Blog:
      - writing/index.md
  - Talks: talks.md

# The CV page is linked from the home page's Contact section, not the menu.
not_in_nav: |
  /cv.md

hooks:
  - hooks/writing.py

plugins:
  - search
  - blog:
      blog_dir: writing
      blog_toc: true
      post_date_format: medium
      post_url_format: "{slug}"
      post_readtime: true
      post_excerpt: required
      archive: false
      categories: true
      categories_name: Topics
  - macros:
      include_dir: includes
      module_name: macros

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SaeedTaghavi
      name: GitHub
    - icon: fontawesome/brands/gitlab
      link: https://gitlab.com/SaeedTaghavi
      name: GitLab
    - icon: fontawesome/brands/google-scholar
      link: https://scholar.google.com/citations?user=ew2KPK4AAAAJ
      name: Google Scholar
    - icon: fontawesome/brands/orcid
      link: https://orcid.org/0000-0003-1685-5639
      name: ORCID
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/saeed-taghavi-a16488130/
      name: LinkedIn
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/SaeedTaghaviV
      name: X
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@saeedtaghavi7209
      name: YouTube
    - icon: fontawesome/solid/envelope
      link: mailto:saeed.taghavi.v@gmail.com
      name: Email
  generator: false
  # Home banner portrait. Put the image in docs/assets/images/ and set the
  # path, e.g. assets/images/photo.jpg. Until then the initials are shown.
  photo: assets/images/photo.jpg
  initials: ST
  # Lines under the name in the banner on every page.
  banner_lines:
    - Postdoctoral Researcher in Computational Neuroscience
    - Zapata-Briceño Institute of Neuroscience, Madrid

extra_css:
  - assets/stylesheets/site.css

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - assets/javascripts/filters.js
  - assets/javascripts/nav.js

copyright: Saeed Taghavi · Zapata-Briceño Institute of Neuroscience, Madrid
