<svg viewBox="0 0 500 200" role="img" aria-label="The voting app: voters use the vote page in Python, which pushes each vote to a Redis queue; a .NET worker takes votes from the queue and stores them in Postgres; the result page in Node.js reads Postgres and shows the totals to viewers" class="st-svg st-figure-svg">
