<g style="fill: var(--st-c2); stroke: var(--st-c2)" fill-opacity="0.1" stroke-width="1.6"><rect x="92" y="26" width="100" height="46" rx="4"></rect><rect x="392" y="26" width="100" height="46" rx="4"></rect><rect x="92" y="126" width="100" height="46" rx="4"></rect></g>
<g style="fill: var(--st-c3); stroke: var(--st-c3)" fill-opacity="0.14" stroke-width="1.6"><rect x="242" y="26" width="100" height="46" rx="4"></rect><rect x="242" y="126" width="100" height="46" rx="4"></rect></g>
<g style="fill: var(--st-ink); font-family: 'IBM Plex Mono', monospace; font-size: 13px" text-anchor="middle"><text x="142" y="46">vote</text><text x="292" y="46">redis</text><text x="442" y="46">worker</text><text x="292" y="146">postgres</text><text x="142" y="146">result</text></g>
<g style="fill: var(--st-muted); font-family: 'IBM Plex Mono', monospace; font-size: 10px" text-anchor="middle"><text x="142" y="62">Python</text><text x="292" y="62">queue</text><text x="442" y="62">.NET</text><text x="292" y="162">database</text><text x="142" y="162">Node.js</text></g>
<g fill="none" style="stroke: var(--st-muted)" stroke-width="1.4" marker-end="url(#va-arrow)"><path d="M62 49 H 89"></path><path d="M192 49 H 239"></path><path d="M342 49 H 389"></path><path d="M442 72 V 149 H 345"></path><path d="M242 149 H 195"></path><path d="M92 149 H 65"></path></g>
<g style="fill: var(--st-muted); font-family: 'IBM Plex Mono', monospace; font-size: 10px" text-anchor="middle"><text x="217" y="42">push</text><text x="367" y="42">pop</text><text x="466" y="114">store</text><text x="217" y="142">read</text></g>
