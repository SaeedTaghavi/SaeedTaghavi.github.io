- title: Phase-Dependent Suppression of Neuronal Oscillations
  youtube: GGTBYIeM1FU
  cover: cover-suppression.svg
  audience: Academic
  theme: Synchrony on networks
  date: 20 Feb 2020
  duration: "18:08"
